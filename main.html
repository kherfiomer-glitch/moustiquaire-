<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moustiquaire en Rouleur</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f3;
      color: #20241f;
    }

    .container {
      width: min(700px, 92%);
      margin: auto;
    }

    header {
      text-align: center;
      padding: 55px 0 30px;
    }

    .badge {
      display: inline-block;
      background: #e5eee2;
      color: #42613e;
      padding: 8px 16px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 14px;
    }

    h1 {
      font-size: 42px;
      margin: 18px 0 10px;
    }

    .subtitle {
      color: #70776e;
      font-size: 17px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 15px 45px rgba(0,0,0,.08);
      margin-bottom: 50px;
    }

    h2 {
      font-size: 20px;
      margin: 0 0 18px;
    }

    .product {
      background: #f0f6ed;
      border: 2px solid #6c9165;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .product-name {
      font-weight: bold;
      font-size: 18px;
    }

    .price {
      color: #42613e;
      font-weight: bold;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .field {
      margin-bottom: 15px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 7px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #d5d9d3;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #6c9165;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .total {
      background: #20241f;
      color: white;
      padding: 18px;
      border-radius: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0 30px;
    }

    .total strong {
      font-size: 25px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: #6c9165;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #567650;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #status {
      text-align: center;
      font-weight: bold;
      margin-top: 15px;
      min-height: 25px;
    }

    .success {
      color: #3f7a39;
    }

    .error {
      color: #b33a32;
    }

    .small {
      text-align: center;
      color: #858b83;
      font-size: 12px;
      margin-top: 12px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 32px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .product {
        flex-direction: column;
        align-items: flex-start;
      }

      .card {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container">
    <div class="badge">Moustiquaire en Rouleur</div>

    <h1>Commandez votre moustiquaire</h1>

    <p class="subtitle">
      Entrez vos dimensions et vos informations pour envoyer votre commande.
    </p>
  </div>
</header>

<main class="container">

  <form class="card" id="orderForm">

    <h2>Votre produit</h2>

    <div class="product">
      <div class="product-name">
        Moustiquaire en Rouleur
      </div>

      <div class="price">
        6 500 DA / m²
      </div>
    </div>

    <h2>Dimensions</h2>

    <div class="grid">

      <div class="field">
        <label>Largeur (cm)</label>
        <input
          type="number"
          id="width"
          min="1"
          step="0.1"
          placeholder="Ex. 120"
          required
        >
      </div>

      <div class="field">
        <label>Hauteur (cm)</label>
        <input
          type="number"
          id="height"
          min="1"
          step="0.1"
          placeholder="Ex. 150"
          required
        >
      </div>

      <div class="field full">
        <label>Nombre de fenêtres</label>
        <input
          type="number"
          id="quantity"
          min="1"
          value="1"
          required
        >
      </div>

    </div>

    <div class="total">
      <span>Total estimé</span>
      <strong id="total">0 DA</strong>
    </div>

    <h2>Informations client</h2>

    <div class="grid">

      <div class="field">
        <label>Nom complet</label>
        <input
          type="text"
          id="name"
          placeholder="Votre nom"
          required
        >
      </div>

      <div class="field">
        <label>Téléphone</label>
        <input
          type="tel"
          id="phone"
          placeholder="05 XX XX XX XX"
          required
        >
      </div>

      <div class="field full">
        <label>Wilaya / Région</label>
        <input
          type="text"
          id="wilaya"
          placeholder="Votre wilaya"
          required
        >
      </div>

      <div class="field full">
        <label>Notes</label>
        <textarea
          id="notes"
          placeholder="Informations supplémentaires..."
        ></textarea>
      </div>

    </div>

    <button type="submit" id="submitBtn">
      Envoyer la commande
    </button>

    <div id="status"></div>

    <div class="small">
      Votre commande sera enregistrée automatiquement.
    </div>

  </form>

</main>

<script>

const PRICE_PER_M2 = 6500;

/*
  Google Apps Script Web App
*/
const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzvFPRyNpLyUa4meGav_lCDR1RjiplrACcncsW1zNbNxDR8iHhfqe9atqqZ7j7n1aD3yQ/exec";


const widthInput = document.getElementById("width");
const heightInput = document.getElementById("height");
const quantityInput = document.getElementById("quantity");
const totalElement = document.getElementById("total");

const form = document.getElementById("orderForm");
const submitBtn = document.getElementById("submitBtn");
const statusElement = document.getElementById("status");


function calculatePrice() {

  const width =
    Number(widthInput.value) || 0;

  const height =
    Number(heightInput.value) || 0;

  const quantity =
    Number(quantityInput.value) || 0;

  const surface =
    (width / 100) *
    (height / 100) *
    quantity;

  const total =
    surface * PRICE_PER_M2;

  totalElement.textContent =
    Math.round(total).toLocaleString("fr-FR") + " DA";

  return {
    surface,
    total
  };
}


widthInput.addEventListener("input", calculatePrice);
heightInput.addEventListener("input", calculatePrice);
quantityInput.addEventListener("input", calculatePrice);


form.addEventListener("submit", async function(event) {

  event.preventDefault();

  statusElement.className = "";
  statusElement.textContent = "";

  const result = calculatePrice();

  const data = {

    name:
      document.getElementById("name").value.trim(),

    phone:
      document.getElementById("phone").value.trim(),

    wilaya:
      document.getElementById("wilaya").value.trim(),

    width_cm:
      Number(widthInput.value),

    height_cm:
      Number(heightInput.value),

    quantity:
      Number(quantityInput.value),

    surface_m2:
      Number(result.surface.toFixed(2)),

    price_per_m2:
      PRICE_PER_M2,

    total_da:
      Math.round(result.total),

    notes:
      document.getElementById("notes").value.trim()
  };


  submitBtn.disabled = true;
  submitBtn.textContent = "Envoi en cours...";


  try {

    const body =
      new URLSearchParams(data);


    await fetch(
      GOOGLE_SCRIPT_URL,
      {
        method: "POST",
        mode: "no-cors",
        body: body
      }
    );


    statusElement.className = "success";

    statusElement.textContent =
      "✓ Commande envoyée avec succès";


    form.reset();

    quantityInput.value = 1;

    calculatePrice();


  } catch (error) {

    statusElement.className = "error";

    statusElement.textContent =
      "Une erreur est survenue. Veuillez réessayer.";

    console.error(error);

  }


  submitBtn.disabled = false;

  submitBtn.textContent =
    "Envoyer la commande";

});


calculatePrice();

</script>

</body>
</html>
